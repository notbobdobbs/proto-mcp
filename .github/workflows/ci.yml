name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read the release from go.mod's `go` line (1.27.4). Go 1.27
          # drops a toolchain line that only repeats that version, and
          # govulncheck refuses a module tidy would rewrite, so the go
          # line is the pin. A floating "1.26.x" once resolved to an older
          # patch, and setup-go exports GOTOOLCHAIN=local, so Go could not
          # self-upgrade. The job then failed with "go.mod requires go >=
          # … (running go …)". One source means the installed toolchain
          # and the floor stay the same release.
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: build touchid helper
        # Phase 4/C — the Swift helper for Touch ID prompts. macos-14
        # has swiftc preinstalled. We verify it BUILDS here even
        # though no Go test exercises it; the broker tests use a
        # POSIX shell-script fixture so they're fast and don't need
        # biometric hardware.
        run: make touchid

      - name: go test -race
        run: go test -race ./...

  # Real darwin pty: poll on /dev/tty does not deliver keystrokes, and
  # raw mode with ISIG off swallows Ctrl+C. This job is the check that
  # the masked password prompt types, backspaces, accepts CR and LF,
  # and cancels on Ctrl+C, SIGTERM and SIGHUP.
  prompt-macos:
    name: macOS password prompt
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: pty prompt tests
        run: go test -count=1 -timeout 180s ./internal/cli/ -run 'TestPromptPTY|TestPromptSecretCancel|TestReadMasked|TestPTYRawBurst'

  vulncheck:
    # macOS runner because internal/keystore depends on keybase/go-keychain
    # which is a cgo wrapper over Security.framework — Linux can't link
    # the symbols, so govulncheck's `loading packages` step fails before
    # it gets to the vulnerability scan.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Same go.mod `go` line as the test job (1.27.4).
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # NOTE: golangci-lint job is intentionally absent. v1.64.8 (the latest
  # v1 release as of 2026-05) was built with Go 1.24 and refuses to load
  # configs targeting Go 1.26 ("the Go language version used to build
  # golangci-lint is lower than the targeted Go version"). v2.x is a
  # rewrite with breaking config-schema changes. Adding lint back is
  # tracked as a Phase-1.5 follow-up — either pin a v2 build that
  # supports 1.26 and rewrite .golangci.yml, or wait for golangci-lint
  # to ship a 1.26-built v1 patch release.
